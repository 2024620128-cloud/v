<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelulut AR Example</title>
<style>
body{font-family:Arial,sans-serif;background:#edf7ed;color:#203629;margin:0;padding:24px;text-align:center}
main{max-width:560px;margin:auto;background:white;padding:24px;border-radius:18px}
.scene{height:280px;border-radius:14px;background:linear-gradient(#cbe8f5 58%,#a9cc91 58%);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.sun{position:absolute;right:22px;top:20px;width:42px;height:42px;background:#ffdf7c;border-radius:50%}
.roof{width:145px;height:35px;background:#795239;border-radius:50% 50% 4px 4px;border:3px solid #553923}
.hive{width:112px;height:82px;background:repeating-linear-gradient(#d8a45d 0 17px,#b97c3e 17px 21px);border:3px solid #553923;border-radius:8px 8px 18px 18px;position:relative}
.entrance{position:absolute;bottom:8px;left:46px;width:18px;height:8px;background:#30231b;border-radius:50%}
.bee{position:absolute;font-size:26px}.bee1{top:90px;left:18%}.bee2{top:135px;right:18%}
button{margin:14px 4px 0;padding:12px 16px;border:0;border-radius:9px;background:#267447;color:#fff;font-weight:bold}
#details{display:none;text-align:left;background:#f0f7f1;padding:12px;border-radius:10px;margin-top:14px}
</style>
</head>
<body><main>
<h1>🐝 Kelulut AR Example</h1>
<p>Simple prototype preview (sample HTML)</p>
<div class="scene"><span class="sun"></span><span class="bee bee1">🐝</span><span class="bee bee2">🐝</span><div class="roof"></div><div class="hive"><div class="entrance"></div></div></div>
<button onclick="document.getElementById('details').style.display='block'">View Details</button>
<button onclick="document.getElementById('details').style.display='none'">Reset</button>
<div id="details"><h3>Prototype Information</h3><p>This is a visual mock-up of a kelulut hive. A future version could add a humidity sensor and real camera-based AR.</p></div>
<p><small>This is a sample web page, not live camera AR.</small></p>
</main></body></html>
